name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ feature/deepseek-cloud ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.*'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Prepare Flutter iOS project
        run: flutter build ios --release --no-codesign || true
      - name: Build iOS with signing explicitly disabled
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/UnsignedDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          test -d build/UnsignedDerivedData/Build/Products/Release-iphoneos/Runner.app
      - name: Package for external signing
        run: |
          mkdir -p Payload
          cp -R build/UnsignedDerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry PortableAI-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: portable-ai-deepseek-unsigned-ipa
          path: PortableAI-unsigned.ipa
          if-no-files-found: error
